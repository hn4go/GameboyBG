<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Game Boy Wallpaper</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0f380f;cursor:none}
  canvas{position:fixed;left:0;top:0;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';

/* ---------- configuração ---------- */
const REF_H = 144;          // altura lógica de referência (Game Boy)
const FPS   = 10;           // limite de quadros por segundo
const FRAME = 1000 / FPS;
const FG_SPEED = 4;         // px/s de rolagem do primeiro plano (parallax lento)

// as únicas 4 cores usadas (escuro -> claro)
const PAL = [0x0f380f, 0x306230, 0x8bac0f, 0x9bbc0f];
const PAL32 = PAL.map(c => 0xff000000 | ((c & 255) << 16) | (c & 0xff00) | (c >> 16));

/* materiais: cada um mapeia para um tom de dia e um de noite */
const MATS = [
  /* SKY    */ [3, 0],
  /* STAR   */ [3, 3],
  /* SUN    */ [2, 2],
  /* SUNR   */ [1, 1],
  /* MOON   */ [3, 3],
  /* FARA   */ [2, 1],
  /* FARB   */ [2, 0],
  /* CLOUD  */ [2, 1],
  /* MID    */ [1, 0],
  /* GROUND */ [2, 0],
  /* GRASS  */ [1, 1],
  /* TRUNK  */ [0, 1],
  /* LEAFA  */ [0, 1],
  /* LEAFB  */ [1, 0],
  /* CHARA  */ [0, 3],
  /* CHARB  */ [1, 2],
  /* BIRD   */ [0, 2],
];
const [SKY, STAR, SUN, SUNR, MOON, FARA, FARB, CLOUD, MID, GROUND, GRASS,
       TRUNK, LEAFA, LEAFB, CHARA, CHARB, BIRD] = MATS.map((_, i) => i);
const DAY = MATS.map(m => m[0]);
const NIGHT = MATS.map(m => m[1]);

const BAYER = [0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5];

/* ---------- estado ---------- */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
let W, H, OY, S, img, buf32, mat;
let T = 0, camX = 0, L = 1;
let stars = [], clouds = [];

function mulberry(a) {
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* hora do dia (permite ?hora=22.5 para testar) */
const q = new URLSearchParams(location.search);
function hourNow() {
  const o = parseFloat(q.get('hora'));
  if (!isNaN(o)) return ((o % 24) + 24) % 24;
  const d = new Date();
  return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
}
function smooth(a, b, x) {
  x = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return x * x * (3 - 2 * x);
}
function daylight(h) {
  return h < 12 ? smooth(5.5, 7.5, h) : 1 - smooth(17.5, 19.5, h);
}

/* ---------- primitivas ---------- */
function put(x, y, m) {
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  mat[y * W + x] = m;
}
function px(x, y, m) { put(x, y + OY, m); }
function rect(x, y, w, h, m) {
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) px(x + i, y + j, m);
}
function disc(cx, cy, r, m) {
  const R = Math.ceil(r);
  for (let dy = -R; dy <= R; dy++)
    for (let dx = -R; dx <= R; dx++)
      if (dx * dx + dy * dy <= r * r) px(cx + dx, cy + dy, m);
}
const pk = u => { u -= Math.floor(u); return 1 - Math.abs(u * 2 - 1); };
const mod = (a, n) => ((a % n) + n) % n;

/* ---------- inicialização ---------- */
function setup() {
  const dpr = window.devicePixelRatio || 1;
  const pw = Math.max(1, Math.round(innerWidth * dpr));
  const ph = Math.max(1, Math.round(innerHeight * dpr));
  S = Math.max(1, Math.round(ph / REF_H));      // escala inteira => pixels nítidos
  W = Math.ceil(pw / S);
  H = Math.ceil(ph / S);
  OY = H - REF_H;                               // cena ancorada embaixo
  cv.width = W; cv.height = H;
  cv.style.width = (W * S / dpr) + 'px';
  cv.style.height = (H * S / dpr) + 'px';
  img = ctx.createImageData(W, H);
  buf32 = new Uint32Array(img.data.buffer);
  mat = new Uint8Array(W * H);

  const r = mulberry(7);
  stars = [];
  for (let i = 0; i < Math.round(W / 4); i++)
    stars.push({ x: Math.floor(r() * W), y: Math.floor(r() * (70 + OY)), big: r() < 0.12 });
  clouds = [];
  for (let i = 0; i < 5; i++)
    clouds.push({ x: i * (W / 5) + r() * 20, y: 14 + Math.floor(r() * 36),
                  tpl: r() < 0.5 ? 0 : 1, sp: 2 + r() * 3 });
}

/* ---------- elementos da cena ---------- */
const CLOUD_TPL = [
  [[4,6],[1,12],[0,14],[2,11]],
  [[6,5],[3,10],[0,16],[0,16],[2,12]],
];
function drawCloud(c) {
  const rows = CLOUD_TPL[c.tpl], x0 = Math.round(c.x), y0 = Math.round(c.y);
  rows.forEach(([xo, w], j) => {
    const last = j === rows.length - 1;
    for (let i = 0; i < w; i++)
      if (!last || ((x0 + i + j) & 1) === 0) px(x0 + xo + i, y0 + j, CLOUD);
  });
}

function ridgeFar(wx) {
  return Math.floor(84 - 30 * pk(wx / 192) - 12 * pk(wx / 96 + .25) - 5 * pk(wx / 48 + .6));
}
function ridgeMid(wx) {
  const a = wx * 2 * Math.PI / 200;
  return Math.floor(95 - 5 * Math.sin(a) - 3 * Math.sin(2 * a + 1));
}

/* árvores (período 360px) */
const TREES = [
  { x: 30,  by: 112, type: 0, R: 7 },
  { x: 95,  by: 113, type: 1, n: 3 },
  { x: 160, by: 112, type: 0, R: 10 },
  { x: 228, by: 114, type: 1, n: 4 },
  { x: 300, by: 111, type: 0, R: 7 },
];
function drawTree(t, sx) {
  const wind = Math.sin(T * 0.9 + t.x * 0.1) * (0.8 + 0.4 * Math.sin(T * 0.23));
  if (t.type === 0) {
    const R = t.R, th = R < 9 ? 6 : 8, top = t.by - th - 2 * R;
    rect(sx - 1, t.by - th, 2, th, TRUNK);
    for (let r = 0; r <= 2 * R; r++) {
      const dy = r - R, hw = Math.floor(Math.sqrt(R * R - dy * dy) * 0.97);
      const off = Math.round(wind * (1 - r / (2 * R)) * 1.6);
      for (let dx = -hw; dx <= hw; dx++) {
        const light = ((dx + r) & 1) === 0 && dx < 0 && dy < R * 0.2;
        px(sx + dx + off, top + r, light ? LEAFB : LEAFA);
      }
    }
  } else {
    const tiers = t.n, th = 4, total = tiers * 6, top = t.by - th - total;
    rect(sx - 1, t.by - th, 2, th, TRUNK);
    for (let r = 0; r < total; r++) {
      const tt = r % 6, hw = 1 + Math.floor(tt * 0.8) + Math.floor(r / 6);
      const off = Math.round(wind * (1 - r / total) * 1.6);
      for (let dx = -hw; dx <= hw; dx++)
        px(sx + dx + off, top + r, (dx === -hw && (r & 1) === 0) || (tt === 5 && dx < 0) ? LEAFB : LEAFA);
    }
  }
}
function drawTrees() {
  const P = 360, off = camX * FG_SPEED / FG_SPEED;   // mesma velocidade do primeiro plano
  const list = TREES.slice().sort((a, b) => a.by - b.by);
  for (const t of list) {
    const sx = mod(t.x - off, P);
    for (let s = sx - P; s < W + 24; s += P)
      if (s > -24) drawTree(t, Math.round(s));
  }
}

/* tufos de grama */
function genTufts(n, y0, y1, h0, h1, seed) {
  const r = mulberry(seed), a = [];
  for (let i = 0; i < n; i++)
    a.push({ x: Math.floor(r() * 360), y: y0 + Math.floor(r() * (y1 - y0)),
             h: h0 + Math.floor(r() * (h1 - h0 + 1)) });
  return a;
}
const TUFT_BACK  = genTufts(30, 108, 121, 2, 3, 11);
const TUFT_FRONT = genTufts(26, 128, 144, 3, 5, 23);
function drawTufts(list, speed) {
  const P = 360, off = camX * speed;
  const gust = 0.7 + 0.3 * Math.sin(T * 0.25);
  for (const g of list) {
    const sx = mod(g.x - off, P);
    const sw = Math.sin(T * 1.1 + g.x * 0.05) * gust;
    for (let s = sx - P; s < W + 4; s += P) {
      if (s < -4) continue;
      const bx = Math.round(s);
      for (const [dx, hh] of [[-2, g.h - 1], [0, g.h], [2, g.h - 1]])
        for (let k = 0; k < hh; k++)
          px(bx + dx + Math.round(sw * (k / hh) * 1.6), g.y - k, GRASS);
    }
  }
}

/* personagem */
const SPR_TOP = [
  '..AAAA..',
  '.AAAAAA.',
  '.BBBBAB.',
  '..BBBB..',
  '..AAAA..',
  '.AAAAAA.',
  '.BAAAAB.',
  '..AAAA..',
  '..AAAA..',
];
const SPR_LEGS = [
  ['..AA.AA.', '..AA.AA.', '..AA.AA.'],   // parado
  ['..AA.AA.', '.AA...AA', '.AA....A'],   // passo
  ['..AA.AA.', '..AA.AA.', '..AAAAA.'],   // pés juntos
];
const STEP = [1, 0, 2, 0];
const ch = { state: 'away', t: 2, wx: 0, pauseX: 0, willPause: false, idle: 0 };
function charScreenX() { return Math.round(ch.wx - camX); }
function drawChar() {
  if (ch.state === 'away') return;
  const sx = charScreenX() - 4, walking = ch.state === 'walk';
  const f = walking ? STEP[Math.floor(T * 5) % 4] : 0;
  const bob = walking && f === 0 ? 1 : 0, top = 111 - bob;
  const rows = SPR_TOP.concat(SPR_LEGS[f]);
  rows.forEach((row, j) => {
    for (let i = 0; i < 8; i++) {
      const c = row[i];
      if (c !== '.') px(sx + i, top + j, c === 'A' ? CHARA : CHARB);
    }
  });
}
function updateChar(dt) {
  if (ch.state === 'away') {
    ch.t -= dt;
    if (ch.t <= 0) {
      ch.state = 'walk';
      ch.wx = -12 + camX;
      ch.willPause = Math.random() < 0.6;
      ch.pauseX = 40 + Math.random() * Math.max(10, W - 80);
    }
  } else if (ch.state === 'walk') {
    ch.wx += 12 * dt;
    const sx = ch.wx - camX;
    if (ch.willPause && sx >= ch.pauseX) {
      ch.willPause = false; ch.state = 'idle'; ch.idle = 3 + Math.random() * 3;
    } else if (sx > W + 12) {
      ch.state = 'away'; ch.t = 15 + Math.random() * 30;
    }
  } else {
    ch.idle -= dt;
    if (ch.idle <= 0) ch.state = 'walk';
  }
}

/* pássaros */
const BIRD_A = [[-3,-1],[-2,-1],[-1,0],[0,0],[1,0],[2,-1],[3,-1]];
const BIRD_B = [[-3,1],[-2,0],[-1,0],[0,-1],[1,0],[2,0],[3,1]];
let birds = [], birdTimer = 4;
function spawnFlock() {
  const dir = Math.random() < 0.5 ? 1 : -1, n = 1 + Math.floor(Math.random() * 3);
  const y = 16 + Math.random() * 34, v = 14 + Math.random() * 8;
  for (let i = 0; i < n; i++)
    birds.push({ x: (dir > 0 ? -8 : W + 8) - dir * i * 9, y: y + i * 3 + (i & 1) * 2,
                 v: v * dir, ph: Math.random() * 6 });
}
function updateBirds(dt) {
  birdTimer -= dt;
  if (birdTimer <= 0) { spawnFlock(); birdTimer = 10 + Math.random() * 25; }
  for (const b of birds) b.x += b.v * dt;
  birds = birds.filter(b => b.x > -30 && b.x < W + 30);
}
function drawBirds() {
  for (const b of birds) {
    const f = (Math.floor(T * 3 + b.ph) & 1) ? BIRD_A : BIRD_B;
    const x = Math.round(b.x), y = Math.round(b.y + Math.sin(T * 0.8 + b.ph) * 2);
    for (const [dx, dy] of f) px(x + dx, y + dy, BIRD);
  }
}

/* ---------- render ---------- */
function render() {
  const h = hourNow();
  L = daylight(h);
  mat.fill(SKY);

  // estrelas (só à noite, piscando devagar)
  if (L < 0.75) {
    stars.forEach((s, i) => {
      if ((Math.floor(T / 1.5) + i * 7) % 9 === 0) return;
      put(s.x, s.y, STAR);
      if (s.big) { put(s.x - 1, s.y, STAR); put(s.x + 1, s.y, STAR); put(s.x, s.y - 1, STAR); put(s.x, s.y + 1, STAR); }
    });
  }

  // sol e lua em arco
  const p = (h - 6) / 12, qm = mod(h - 18, 24) / 12;
  if (p > -0.05 && p < 1.05) {
    const cx = Math.round(-6 + p * (W + 12)), cy = Math.round(98 - Math.sin(Math.PI * p) * 70);
    disc(cx, cy, 5, SUNR); disc(cx, cy, 4, SUN);
  }
  if (qm > -0.05 && qm < 1.05) {
    const cx = Math.round(-6 + qm * (W + 12)), cy = Math.round(98 - Math.sin(Math.PI * qm) * 70);
    disc(cx, cy, 5, MOON); disc(cx + 3, cy - 2, 4.4, SKY);
  }

  // montanhas ao fundo
  const offF = camX * 0.12;
  for (let x = 0; x < W; x++) {
    const wx = Math.floor(x + offF), y0 = ridgeFar(wx);
    for (let y = y0; y < 112; y++) px(x, y, ((wx + y) & 1) ? FARB : FARA);
  }

  // nuvens
  for (const c of clouds) drawCloud(c);

  // colinas
  const offM = camX * 0.35;
  for (let x = 0; x < W; x++) {
    const wx = Math.floor(x + offM), y0 = ridgeMid(wx);
    for (let y = y0; y < 112; y++) px(x, y, MID);
  }

  // chão
  rect(0, 106, W, REF_H - 106 + Math.max(0, OY) + 4, GROUND);
  for (let x = 0; x < W; x++)
    if (mod(Math.floor(x + camX), 3) !== 0) px(x, 106, GRASS);

  drawTrees();
  drawTufts(TUFT_BACK, 1);
  drawChar();
  drawTufts(TUFT_FRONT, 2);
  drawBirds();

  // paleta final com dithering de Bayer (transição suave de dia/noite)
  for (let y = 0, i = 0; y < H; y++) {
    const by = (y & 3) << 2;
    // a transição varre o céu de cima para baixo (o brilho do horizonte é o último a sumir)
    const Ly = L * 1.5 - 0.5 * (1 - y / H);
    for (let x = 0; x < W; x++, i++) {
      const m = mat[i];
      buf32[i] = PAL32[((BAYER[by | (x & 3)] + 0.5) / 16 < Ly) ? DAY[m] : NIGHT[m]];
    }
  }
  ctx.putImageData(img, 0, 0);
}

/* ---------- laço principal (10 fps) ---------- */
function update(dt) {
  camX = T * FG_SPEED;
  for (const c of clouds) {
    c.x += c.sp * dt;
    if (c.x > W + 20) { c.x = -20; c.y = 14 + Math.floor(Math.random() * 36); }
  }
  updateBirds(dt);
  updateChar(dt);
}

let last = performance.now();
function frame() {
  const now = performance.now();
  const dt = Math.min(0.5, (now - last) / 1000);
  last = now; T += dt;
  if (!document.hidden) { update(dt); render(); }
  setTimeout(frame, Math.max(0, FRAME - (performance.now() - now)));
}

let rz;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { setup(); render(); }, 150); });

setup();
frame();
})();
</script>
</body>
</html>
